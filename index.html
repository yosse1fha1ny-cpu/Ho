<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حسام العسكري</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00d2ff;
        }

        h2 {
            font-size: 1.5rem;
            color: #ffffff;
            margin-bottom: 40px;
            font-weight: normal;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .btn {
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            color: white;
            padding: 15px 30px;
            font-size: 1.2rem;
            text-decoration: none;
            border-radius: 50px;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
            width: 250px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.6);
        }
    </style>
</head>
<body>

    <h1>حسام العسكري</h1>
    <h2>حسام العسكري لتعديل أجهزة الـ PS4</h2>

    <div class="links-container">
        <a href="https://hossamelaskry.ai.studio/" target="_blank" class="btn">مكتبة الألعاب</a>
        <a href="https://h-s-ps.vercel.app/" target="_blank" class="btn">السحب على الجوائز</a>
    </div>

</body>
</html>
